name: Release

# Tag push -> full test gate -> GitHub Release with tarball + CHANGELOG notes.
# Nothing is published until the gate is green on the tagged commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-pages
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(cat VERSION)
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($version)" >&2
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        run: scripts/release-notes.sh "$(cat VERSION)" > /tmp/notes.md

      - name: Build tarball
        run: |
          git archive --format=tar.gz --prefix=bitcoin-starter-stack/ \
            -o bitcoin-starter-stack.tar.gz "$GITHUB_REF_NAME"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" bitcoin-starter-stack.tar.gz \
            --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md

  # Publish prebuilt multi-arch images (amd64 + arm64/Pi) to GHCR so end users
  # pull instead of building. Independent of `publish`: a registry hiccup here
  # won't block the source release, and compose falls back to a local build.
  images:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30 # multi-arch arm64 build is emulated (slow)
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable arm64 emulation (QEMU)
        run: docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64

      - name: Set up buildx (container driver for multi-arch)
        run: docker buildx create --use --driver docker-container

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push multi-arch images
        run: |
          v="${GITHUB_REF_NAME#v}"
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          base="ghcr.io/$owner/bitcoin-starter-stack"
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t "$base-tor:$v" -t "$base-tor:latest" --push ./build/tor
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f build/dashboard/Dockerfile \
            -t "$base-dashboard:$v" -t "$base-dashboard:latest" --push .

  apt:
    needs: [publish, images]
    if: vars.APT_SIGNING_FINGERPRINT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      APT_SIGNING_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils
      - name: Validate and build package
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          scripts/build-deb.sh
          dpkg-deb --info dist/*.deb
      - name: Build signed APT feed
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          scripts/build-apt.sh
          gpg --verify public/InRelease
      - name: Verify feed with APT
        run: |
          state=$(mktemp -d)
          chmod 755 "$state"
          mkdir -p "$state/lists/partial" "$state/download"
          cp -R public "$state/feed"
          chmod -R a+rX "$state/feed"
          printf 'deb [signed-by=%s/feed/bitcoin-starter-stack.asc] file:%s/feed ./\n' "$state" "$state" >"$state/sources.list"
          options=(-o "Dir::Etc::sourcelist=$state/sources.list" -o Dir::Etc::sourceparts=- -o "Dir::State::lists=$state/lists")
          sudo apt-get "${options[@]}" update
          cd "$state/download"
          sudo apt-get "${options[@]}" download bitcoin-starter-stack
          dpkg-deb --info ./*.deb
      - name: Upload package assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum ./*.deb >SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" ./*.deb SHA256SUMS --clobber
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public
      - name: Deploy signed APT feed
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
