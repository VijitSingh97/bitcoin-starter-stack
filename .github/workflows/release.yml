name: Release

# Tag push -> full test gate -> GitHub Release with tarball + CHANGELOG notes.
# Nothing is published until the gate is green on the tagged commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-pages
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      developer_bot_configured: ${{ steps.bot.outputs.configured }}
    steps:
      - name: Check optional developer bot configuration
        id: bot
        env:
          BOT_CONFIGURED: ${{ (vars.DEVELOPER_BOT_APP_ID != '' || secrets.DEVELOPER_BOT_APP_ID != '') && secrets.DEVELOPER_BOT_PRIVATE_KEY != '' }}
        run: printf 'configured=%s\n' "$BOT_CONFIGURED" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(cat VERSION)
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($version)" >&2
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        run: scripts/release-notes.sh "$(cat VERSION)" > /tmp/notes.md

      - name: Build tarball
        run: |
          git archive --format=tar.gz --prefix=bitcoin-starter-stack/ \
            -o bitcoin-starter-stack.tar.gz "$GITHUB_REF_NAME"

      - name: Build Homebrew formula
        run: scripts/build-homebrew-formula.sh bitcoin-starter-stack.tar.gz

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" bitcoin-starter-stack.tar.gz dist/Formula/bitcoin-starter-stack.rb \
            --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md

  # Publish prebuilt multi-arch images (amd64 + arm64/Pi) to GHCR so end users
  # pull instead of building. Independent of `publish`: a registry hiccup here
  # won't publish a package or tap update until all runtime images exist.
  images:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30 # multi-arch arm64 build is emulated (slow)
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable arm64 emulation (QEMU)
        run: docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64

      - name: Set up buildx (container driver for multi-arch)
        run: docker buildx create --use --driver docker-container

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push multi-arch images
        run: |
          v="${GITHUB_REF_NAME#v}"
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          base="ghcr.io/$owner/bitcoin-starter-stack"
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t "$base-tor:$v" -t "$base-tor:latest" --push ./build/tor
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f build/dashboard/Dockerfile \
            -t "$base-dashboard:$v" -t "$base-dashboard:latest" --push .
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t "$base-monero:$v" -t "$base-monero:latest" --push ./build/monero
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t "$base-litecoin:$v" -t "$base-litecoin:latest" --push ./build/litecoin
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t "$base-dogecoin:$v" -t "$base-dogecoin:latest" --push ./build/dogecoin
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t "$base-bitcoincash:$v" -t "$base-bitcoincash:latest" --push ./build/bitcoincash

  homebrew:
    needs: [publish, images]
    if: needs.publish.outputs.developer_bot_configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BSS_DEVELOPER_BOT_APP_ID: ${{ vars.DEVELOPER_BOT_APP_ID || secrets.DEVELOPER_BOT_APP_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Configure developer bot
        env:
          PRIVATE_KEY: ${{ secrets.DEVELOPER_BOT_PRIVATE_KEY }}
        run: |
          : "${BSS_DEVELOPER_BOT_APP_ID:?set the DEVELOPER_BOT_APP_ID repository variable or secret}"
          : "${PRIVATE_KEY:?set the DEVELOPER_BOT_PRIVATE_KEY repository secret}"
          key="$RUNNER_TEMP/developer-bot.pem"
          printf '%s' "$PRIVATE_KEY" >"$key"
          chmod 600 "$key"
          tools/developer-bot.py configure "$BSS_DEVELOPER_BOT_APP_ID" "$key"
      - name: Propose Homebrew release update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          branch="codex/homebrew-v$version"
          existing=$(tools/developer-bot.py gh pr list --state all --head "$branch" --json number --jq length)
          test "$existing" = 0 || exit 0
          gh release download "$GITHUB_REF_NAME" --pattern bitcoin-starter-stack.tar.gz --dir "$RUNNER_TEMP"
          PACKAGE_VERSION="$version" scripts/build-homebrew-formula.sh \
            --output Formula/bitcoin-starter-stack.rb "$RUNNER_TEMP/bitcoin-starter-stack.tar.gz"
          git add Formula/bitcoin-starter-stack.rb
          git diff --cached --quiet && exit 0
          git switch -c "$branch"
          tools/developer-bot.py git commit -m "Update Homebrew formula to v$version"
          tools/developer-bot.py git push "HEAD:$branch"
          body="$RUNNER_TEMP/homebrew-pr.md"
          printf '%s\n' "Installs the published v$version runtime archive with its SHA-256 pin through Homebrew on macOS and Linux. Container images have finished publishing; installation remains inert and setup is explicit." >"$body"
          tools/developer-bot.py gh pr create --base main --head "$branch" --title "Update Homebrew formula to v$version" --body-file "$body"

  apt:
    needs: [publish, images]
    if: vars.APT_SIGNING_FINGERPRINT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      APT_SIGNING_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils
      - name: Validate and build package
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          scripts/build-deb.sh
          dpkg-deb --info dist/*.deb
      - name: Build signed APT feed
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          scripts/build-apt.sh
          gpg --verify public/InRelease
      - name: Verify feed with APT
        run: |
          state=$(mktemp -d)
          chmod 755 "$state"
          mkdir -p "$state/lists/partial" "$state/download"
          cp -R public "$state/feed"
          chmod -R a+rX "$state/feed"
          printf 'deb [signed-by=%s/feed/bitcoin-starter-stack.asc] file:%s/feed ./\n' "$state" "$state" >"$state/sources.list"
          options=(-o "Dir::Etc::sourcelist=$state/sources.list" -o Dir::Etc::sourceparts=- -o "Dir::State::lists=$state/lists")
          sudo apt-get "${options[@]}" update
          cd "$state/download"
          sudo apt-get "${options[@]}" download bitcoin-starter-stack
          dpkg-deb --info ./*.deb
      - name: Upload package assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum ./*.deb >SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" ./*.deb SHA256SUMS --clobber
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public
      - name: Deploy signed APT feed
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
