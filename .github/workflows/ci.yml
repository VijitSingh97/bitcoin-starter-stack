name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused as the release gate (.github/workflows/release.yml)

# Least privilege: the job only reads the repo to test/lint. Image publishing
# lives in release.yml, which declares its own packages: write.
permissions:
  contents: read

# Cancel a superseded run on the same ref (a new push to the same PR/branch).
# Keyed by ref, so a release-gate run on a tag never collides with branch CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: shellcheck configure.sh stack build/tor/entrypoint.sh scripts/*.sh tests/*.sh

      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD":/repo ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --no-git --source=/repo --config=/repo/.gitleaks.toml --redact --verbose

      - name: Lint Dockerfiles (hadolint)
        run: docker run --rm -v "$PWD":/repo -w /repo hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
          hadolint build/tor/Dockerfile build/dashboard/Dockerfile

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: build/dashboard/go.mod
          cache: false

      - name: Dashboard Go checks
        run: |
          cd build/dashboard
          go test -race ./...
          go vet ./...
          go build -o /tmp/dashboard .

      - name: Python reference + HTTP parity
        run: |
          pip install -r build/dashboard/parity/reference/requirements.txt pytest pytest-cov
          cd build/dashboard
          python -m pytest tests -q --cov=parity/reference --cov-report=term-missing --cov-fail-under=85
          python parity/generate.py --check
          python parity/test_http.py
          DASHBOARD_COMMAND='["/tmp/dashboard"]' python parity/test_http.py

      - name: Frontend unit tests
        run: node --test build/dashboard/static/*.test.mjs

      # configure.sh e2e, compose contract, CLI test, AND the full-stack boot
      # (test_e2e.sh runs here because CI=true — it builds + boots the stack,
      # provisions watch-only wallets, and runs the egress audit).
      - name: Stack tests
        run: tests/run.sh

  package:
    runs-on: ubuntu-latest
    container: ubuntu:24.04@sha256:24737cef17f4e22b1977df7d9a05e77c4e28b7da5b8911f8d8ccda136bf3573c
    timeout-minutes: 15
    steps:
      - name: Install package test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends apt-utils ca-certificates git gnupg jq openssl shellcheck
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trust the container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build and test the package
        run: |
          shellcheck scripts/bitcoin-stack scripts/build-deb.sh scripts/build-apt.sh tests/test_package.sh tests/test_apt.sh
          tests/test_package.sh
          tests/test_apt.sh
      - name: Verify inert install, upgrade, and removal
        run: |
          printf '#!/bin/sh\nexit 101\n' >/usr/sbin/policy-rc.d
          chmod 755 /usr/sbin/policy-rc.d
          package="./dist/bitcoin-starter-stack_$(cat VERSION)_all.deb"
          apt-get install -y --no-install-recommends "$package"
          test "$(dpkg-query -W -f='${Version}' bitcoin-starter-stack)" = "$(cat VERSION)"
          test ! -e /etc/bitcoin-starter-stack
          test ! -e /var/lib/bitcoin-starter-stack
          mkdir -p /var/lib/bitcoin-starter-stack
          touch /var/lib/bitcoin-starter-stack/keep
          apt-get install -y --reinstall "$package"
          apt-get purge -y bitcoin-starter-stack
          test -f /var/lib/bitcoin-starter-stack/keep
