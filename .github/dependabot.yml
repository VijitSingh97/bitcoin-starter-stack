version: 2
updates:
  - package-ecosystem: docker
    directory: /build/dashboard
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /build/tor
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /build/monero
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /build/litecoin
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /build/dogecoin
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /build/bitcoincash
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /build/dashboard
    schedule:
      interval: weekly

  # Direct node images stay digest-pinned here.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: pip
    directory: /build/dashboard/parity/reference
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
