// Minimal wire-compatible subset of Tari v6.2.0 applications/minotari_app_grpc/proto/wallet.proto.
// Upstream: https://github.com/tari-project/tari/blob/v6.2.0/applications/minotari_app_grpc/proto/wallet.proto

syntax = "proto3";

package tari.rpc;

option go_package = "github.com/VijitSingh97/node-manager/dashboard;main";

enum TariWalletConnectivityStatus {
  TARI_WALLET_INITIALIZING = 0;
  TARI_WALLET_ONLINE = 1;
  TARI_WALLET_DEGRADED = 2;
  TARI_WALLET_OFFLINE = 3;
}

message TariWalletEmpty {}
message TariGetVersionRequest {}
message TariGetVersionResponse { string version = 1; }
message TariGetStateRequest {}
message TariGetBalanceRequest {}

message TariGetBalanceResponse {
  uint64 available_balance = 1;
  uint64 pending_incoming_balance = 2;
  uint64 pending_outgoing_balance = 3;
  uint64 timelocked_balance = 4;
}

message TariWalletNetworkStatusResponse {
  TariWalletConnectivityStatus status = 1;
  uint32 avg_latency_ms = 2;
  uint32 num_node_connections = 3;
}

message TariGetStateResponse {
  uint64 scanned_height = 1;
  TariGetBalanceResponse balance = 2;
  TariWalletNetworkStatusResponse network = 3;
  bool has_done_initial_validation = 4;
}

message TariGetCompleteAddressResponse {
  bytes interactive_address = 1;
  bytes one_sided_address = 2;
  string interactive_address_base58 = 3;
  string one_sided_address_base58 = 4;
  string interactive_address_emoji = 5;
  string one_sided_address_emoji = 6;
}

service Wallet {
  rpc GetVersion(TariGetVersionRequest) returns (TariGetVersionResponse);
  rpc GetState(TariGetStateRequest) returns (TariGetStateResponse);
  rpc GetCompleteAddress(TariWalletEmpty) returns (TariGetCompleteAddressResponse);
  rpc GetBalance(TariGetBalanceRequest) returns (TariGetBalanceResponse);
}
