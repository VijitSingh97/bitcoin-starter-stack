// Minimal wire-compatible subset of Tari v6.0.1-pre.0 applications/minotari_app_grpc/proto/base_node.proto.
// Upstream: https://github.com/tari-project/tari/blob/v6.0.1-pre.0/applications/minotari_app_grpc/proto/base_node.proto

syntax = "proto3";

package tari.rpc;

import "google/protobuf/empty.proto";

option go_package = "github.com/VijitSingh97/node-manager/dashboard;main";

enum BaseNodeState {
  START_UP = 0;
  HEADER_SYNC = 1;
  HORIZON_SYNC = 2;
  CONNECTING = 3;
  BLOCK_SYNC = 4;
  LISTENING = 5;
  SYNC_FAILED = 6;
}

enum SyncState {
  STARTUP = 0;
  HEADER_STARTING = 1;
  HEADER = 2;
  BLOCK_STARTING = 3;
  BLOCK = 4;
  DONE = 5;
}

message MetaData {
  uint64 best_block_height = 1;
  bytes best_block_hash = 2;
  bytes accumulated_difficulty = 5;
  uint64 pruned_height = 6;
  uint64 timestamp = 7;
}

message TipInfoResponse {
  MetaData metadata = 1;
  bool initial_sync_achieved = 2;
  BaseNodeState base_node_state = 3;
  bool failed_checkpoints = 4;
}

message SyncProgressResponse {
  uint64 tip_height = 1;
  uint64 local_height = 2;
  SyncState state = 3;
  string short_desc = 4;
  uint64 initial_connected_peers = 5;
}

message BaseNodeGetVersionResponse {
  string version = 1;
  uint32 network = 2;
}

message MempoolStatsResponse {
  uint64 unconfirmed_txs = 2;
  uint64 reorg_txs = 3;
  uint64 unconfirmed_weight = 4;
}

message GetNetworkStateRequest {}

message GetNetworkStateResponse {
  MetaData metadata = 1;
  bool initial_sync_achieved = 2;
  BaseNodeState base_node_state = 3;
  bool failed_checkpoints = 4;
  uint64 reward = 5;
  uint64 sha3x_estimated_hash_rate = 6;
  uint64 monero_randomx_estimated_hash_rate = 7;
  uint64 num_connections = 8;
  uint64 tari_randomx_estimated_hash_rate = 10;
}

service BaseNode {
  rpc GetVersion(google.protobuf.Empty) returns (BaseNodeGetVersionResponse);
  rpc GetSyncProgress(google.protobuf.Empty) returns (SyncProgressResponse);
  rpc GetTipInfo(google.protobuf.Empty) returns (TipInfoResponse);
  rpc GetMempoolStats(google.protobuf.Empty) returns (MempoolStatsResponse);
  rpc GetNetworkState(GetNetworkStateRequest) returns (GetNetworkStateResponse);
}
