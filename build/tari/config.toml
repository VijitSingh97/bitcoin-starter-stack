[base_node]
mining_enabled = true
grpc_enabled = true
grpc_address = "/ip4/0.0.0.0/tcp/18142"
grpc_server_allow_methods = [
  "get_version", "get_sync_info", "get_sync_progress", "get_tip_info",
  "identify", "get_network_status", "get_new_block_template_with_coinbases",
  "submit_block", "get_peers", "list_connected_peers", "get_mempool_stats"
]

[base_node.storage]
pruning_horizon = __PRUNING_HORIZON__
pruning_interval = 50

[base_node.http_wallet_query_service]
port = 9000
listen_ip = "0.0.0.0"
external_address = "http://tari:9000"

[base_node.p2p]
public_addresses = []

[base_node.p2p.transport]
type = "tor"

[base_node.p2p.transport.tor]
control_address = "/ip4/172.29.0.25/tcp/9051"
socks_address_override = "/ip4/172.29.0.25/tcp/9050"
control_auth = "auto"
proxy_bypass_for_outbound_tcp = false
proxy_bypass_addresses = []
onion_port = 18189
