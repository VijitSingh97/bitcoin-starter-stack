      - "io.node-starter-stack.steady-cpus=${DOGECOIN_STEADY_CPUS:-1}"
      - "io.node-starter-stack.steady-memory-mb=${DOGECOIN_STEADY_MEM_LIMIT_MB:-4096}"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      DOGECOIN_RPC_USER: ${DOGECOIN_RPC_USER:?run ./configure.sh first}
      DOGECOIN_RPC_PASSWORD: ${DOGECOIN_RPC_PASSWORD:?run ./configure.sh first}
      DOGECOIN_PRUNE: ${DOGECOIN_PRUNE:-10000}
      TOR_PROXY: 172.29.0.25:9050
    volumes: ["${DOGECOIN_DATA_DIR:-./data/dogecoin}:/data"]
    stop_grace_period: 5m
    restart: ${STACK_RESTART_POLICY:-on-failure:5}
    logging: *logging
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30m
    networks:
      btc_net:
        ipv4_address: 172.29.0.34
    dns: ["127.0.0.1"]

  bitcoincash:
    image: ghcr.io/vijitsingh97/bitcoin-starter-stack-bitcoincash:${STACK_VERSION:?Run stack init or configure.sh first}
    build: ${STACK_ROOT:-.}/build/bitcoincash
    profiles: ["bitcoincash"]
    labels:
      - "io.node-starter-stack.resource-profile=${BITCOINCASH_RESOURCE_PROFILE:-off}"
      - "io.node-starter-stack.steady-cpus=${BITCOINCASH_STEADY_CPUS:-1}"
      - "io.node-starter-stack.steady-memory-mb=${BITCOINCASH_STEADY_MEM_LIMIT_MB:-4096}"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    volumes: ["${BITCOINCASH_DATA_DIR:-./data/bitcoincash}:/data"]
    stop_grace_period: 5m
    restart: ${STACK_RESTART_POLICY:-on-failure:5}
    logging: *logging
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30m
    environment:
      BITCOINCASH_RPC_USER: ${BITCOINCASH_RPC_USER:?run ./configure.sh first}
      BITCOINCASH_RPC_PASSWORD: ${BITCOINCASH_RPC_PASSWORD:?run ./configure.sh first}
      BITCOINCASH_PRUNE: ${BITCOINCASH_PRUNE:-10000}
      TOR_PROXY: 172.29.0.25:9050
    networks:
      btc_net:
        ipv4_address: 172.29.0.35
    dns: ["127.0.0.1"]

  zcash:
    image: zakuracore/zakura:1.7.0@sha256:cf3b2d09a0ab3cd3a5e17cbbb676b7abe719607391402ea07d6402e9af897b6b
    profiles: ["zcash"]
    labels:
      - "io.node-starter-stack.resource-profile=${ZCASH_RESOURCE_PROFILE:-off}"
      - "io.node-starter-stack.steady-cpus=${ZCASH_STEADY_CPUS:-1}"
      - "io.node-starter-stack.steady-memory-mb=${ZCASH_STEADY_MEM_LIMIT_MB:-4096}"
    init: true
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # Zakura's root entrypoint needs to traverse a pre-existing private data directory before dropping privileges.
    cap_add: ["CHOWN", "DAC_READ_SEARCH", "SETGID", "SETUID"]
    environment:
      CONFIG_FILE_PATH: /etc/zakura/zakurad.toml
      ZAKURA_STATE__CACHE_DIR: /data
      ZAKURA_RPC__COOKIE_DIR: /data
    volumes:
      - ${ZCASH_DATA_DIR:-./data/zcash}:/data
      - ${STACK_ASSET_ROOT:-.}/build/zcash/zakurad.toml:/etc/zakura/zakurad.toml:ro
      - ${STACK_ASSET_ROOT:-.}/build/zcash/healthcheck.sh:/usr/local/bin/node-stack-healthcheck:ro
    tmpfs: ["/tmp:size=16m"]
    stop_grace_period: 5m
    restart: ${STACK_RESTART_POLICY:-on-failure:5}
    logging: *logging
    healthcheck:
      test: ["CMD", "/usr/local/bin/node-stack-healthcheck"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30m
    networks:
      btc_net:
        ipv4_address: 172.29.0.36
    dns: ["127.0.0.1"]

  dashboard:
    # Prebuilt release image, with an explicit build target for development.
    image: ghcr.io/vijitsingh97/bitcoin-starter-stack-dashboard:${STACK_VERSION:?Run stack init or configure.sh first}
    build:
      context: ${STACK_ROOT:-.}
      dockerfile: build/dashboard/Dockerfile
    # runs non-root (uid 1000) via USER in build/dashboard/Dockerfile — the
    # exposed service needs no root; it binds an unprivileged port and only
    # writes the /state volume (pre-owned by 1000 in the image)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      BITCOIN_ENABLED: ${BITCOIN_ENABLED:-1}
      BITCOIN_ACTIVE: ${BITCOIN_ACTIVE:-1}
      RPC_USER: ${BITCOIN_RPC_USER:?run ./configure.sh first}
      RPC_PASSWORD: ${BITCOIN_RPC_PASSWORD:?run ./configure.sh first}
      BITCOIN_RPC_EXPOSE: ${BITCOIN_RPC_EXPOSE:-0}
      BITCOIN_RPC_BIND_IP: ${BITCOIN_RPC_BIND_IP:-127.0.0.1}
      BITCOIN_RPC_PORT: ${BITCOIN_RPC_PORT:-8332}
      MONERO_ENABLED: ${MONERO_ENABLED:-0}
      MONERO_ACTIVE: ${MONERO_ACTIVE:-1}
      MONERO_RPC_URL: ${MONERO_RPC_URL:-http://172.29.0.30:18085}
      MONERO_RPC_USER: ${MONERO_RPC_USER:-}
      MONERO_RPC_PASSWORD: ${MONERO_RPC_PASSWORD:-}
      MONERO_WALLET_RPC_URL: ${MONERO_WALLET_RPC_URL:-http://172.29.0.31:18082}
      MONERO_WALLET_RPC_USER: ${MONERO_WALLET_RPC_USER:-}
      MONERO_WALLET_RPC_PASSWORD: ${MONERO_WALLET_RPC_PASSWORD:-}
      MONERO_WALLET_PASSWORD: ${MONERO_WALLET_PASSWORD:-}
      MONERO_DATA_DIR: /data-monero
      MONERO_RPC_EXPOSE: ${MONERO_RPC_EXPOSE:-0}
      MONERO_RPC_BIND_IP: ${MONERO_RPC_BIND_IP:-127.0.0.1}
      MONERO_RPC_PORT: ${MONERO_RPC_PORT:-18081}
      MONERO_ZMQ_EXPOSE: ${MONERO_ZMQ_EXPOSE:-0}
      MONERO_ZMQ_BIND_IP: ${MONERO_ZMQ_BIND_IP:-127.0.0.1}
      MONERO_ZMQ_PORT: ${MONERO_ZMQ_PORT:-18083}
      TARI_ENABLED: ${TARI_ENABLED:-0}
      TARI_ACTIVE: ${TARI_ACTIVE:-1}
      TARI_WALLET_ENABLED: ${TARI_WALLET_ENABLED:-0}
      TARI_GRPC_URL: ${TARI_GRPC_URL:-http://172.29.0.32:18142}
      TARI_WALLET_GRPC_URL: ${TARI_WALLET_GRPC_URL:-http://172.29.0.37:18143}
      TARI_WALLET_RPC_USER: ${TARI_WALLET_RPC_USER:-}
      TARI_WALLET_RPC_PASSWORD: ${TARI_WALLET_RPC_PASSWORD:-}
      TARI_DATA_DIR: /data-tari
      TARI_GRPC_EXPOSE: ${TARI_GRPC_EXPOSE:-0}
      TARI_GRPC_BIND_IP: ${TARI_GRPC_BIND_IP:-127.0.0.1}
      TARI_GRPC_PORT: ${TARI_GRPC_PORT:-18142}
      TARI_STEADY_CPUS: ${TARI_STEADY_CPUS:-1}
      TARI_STEADY_MEM_LIMIT_MB: ${TARI_STEADY_MEM_LIMIT_MB:-4096}
      TARI_RESOURCE_PROFILE: ${TARI_RESOURCE_PROFILE:-off}
      LITECOIN_ENABLED: ${LITECOIN_ENABLED:-0}
      LITECOIN_ACTIVE: ${LITECOIN_ACTIVE:-1}
      LITECOIN_RPC_URL: ${LITECOIN_RPC_URL:-http://172.29.0.33:9332}
      LITECOIN_RPC_USER: ${LITECOIN_RPC_USER:-}
      LITECOIN_RPC_PASSWORD: ${LITECOIN_RPC_PASSWORD:-}
      LITECOIN_DATA_DIR: /data-litecoin
      LITECOIN_RPC_EXPOSE: ${LITECOIN_RPC_EXPOSE:-0}
      LITECOIN_RPC_BIND_IP: ${LITECOIN_RPC_BIND_IP:-127.0.0.1}
      LITECOIN_RPC_PORT: ${LITECOIN_RPC_PORT:-9332}
      LITECOIN_STEADY_CPUS: ${LITECOIN_STEADY_CPUS:-1}
      LITECOIN_STEADY_MEM_LIMIT_MB: ${LITECOIN_STEADY_MEM_LIMIT_MB:-4096}
      LITECOIN_RESOURCE_PROFILE: ${LITECOIN_RESOURCE_PROFILE:-off}
      DOGECOIN_ENABLED: ${DOGECOIN_ENABLED:-0}
      DOGECOIN_ACTIVE: ${DOGECOIN_ACTIVE:-1}
      DOGECOIN_RPC_URL: ${DOGECOIN_RPC_URL:-http://172.29.0.34:22555}
      DOGECOIN_RPC_USER: ${DOGECOIN_RPC_USER:-}
      DOGECOIN_RPC_PASSWORD: ${DOGECOIN_RPC_PASSWORD:-}
      DOGECOIN_DATA_DIR: /data-dogecoin
      DOGECOIN_RPC_EXPOSE: ${DOGECOIN_RPC_EXPOSE:-0}
      DOGECOIN_RPC_BIND_IP: ${DOGECOIN_RPC_BIND_IP:-127.0.0.1}
      DOGECOIN_RPC_PORT: ${DOGECOIN_RPC_PORT:-22555}
      DOGECOIN_STEADY_CPUS: ${DOGECOIN_STEADY_CPUS:-1}
      DOGECOIN_STEADY_MEM_LIMIT_MB: ${DOGECOIN_STEADY_MEM_LIMIT_MB:-4096}
      DOGECOIN_RESOURCE_PROFILE: ${DOGECOIN_RESOURCE_PROFILE:-off}
      BITCOINCASH_ENABLED: ${BITCOINCASH_ENABLED:-0}
      BITCOINCASH_ACTIVE: ${BITCOINCASH_ACTIVE:-1}
      BITCOINCASH_RPC_URL: ${BITCOINCASH_RPC_URL:-http://172.29.0.35:8332}
      BITCOINCASH_RPC_USER: ${BITCOINCASH_RPC_USER:-}
      BITCOINCASH_RPC_PASSWORD: ${BITCOINCASH_RPC_PASSWORD:-}
      BITCOINCASH_DATA_DIR: /data-bitcoincash
      BITCOINCASH_RPC_EXPOSE: ${BITCOINCASH_RPC_EXPOSE:-0}
      BITCOINCASH_RPC_BIND_IP: ${BITCOINCASH_RPC_BIND_IP:-127.0.0.1}
      BITCOINCASH_RPC_PORT: ${BITCOINCASH_RPC_PORT:-8332}
      BITCOINCASH_STEADY_CPUS: ${BITCOINCASH_STEADY_CPUS:-1}
      BITCOINCASH_STEADY_MEM_LIMIT_MB: ${BITCOINCASH_STEADY_MEM_LIMIT_MB:-4096}
      BITCOINCASH_RESOURCE_PROFILE: ${BITCOINCASH_RESOURCE_PROFILE:-off}
      ZCASH_ENABLED: ${ZCASH_ENABLED:-0}
      ZCASH_ACTIVE: ${ZCASH_ACTIVE:-1}
      ZCASH_RPC_URL: ${ZCASH_RPC_URL:-http://172.29.0.36:8232}
      ZCASH_RPC_USER: ${ZCASH_RPC_USER:-}
      ZCASH_RPC_PASSWORD: ${ZCASH_RPC_PASSWORD:-}
      ZCASH_DATA_DIR: /data-zcash
      ZCASH_RPC_EXPOSE: ${ZCASH_RPC_EXPOSE:-0}
      ZCASH_RPC_BIND_IP: ${ZCASH_RPC_BIND_IP:-127.0.0.1}
      ZCASH_RPC_PORT: ${ZCASH_RPC_PORT:-8232}
      ZCASH_STEADY_CPUS: ${ZCASH_STEADY_CPUS:-1}
      ZCASH_STEADY_MEM_LIMIT_MB: ${ZCASH_STEADY_MEM_LIMIT_MB:-4096}
      ZCASH_RESOURCE_PROFILE: ${ZCASH_RESOURCE_PROFILE:-off}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      DASHBOARD_BIND_IP: ${DASHBOARD_BIND_IP:-127.0.0.1}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-80}
      SETTINGS_PORT: "8001"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      HEALTHCHECKS_URL: ${HEALTHCHECKS_URL:-}
      ALERT_NEW_BLOCK: ${ALERT_NEW_BLOCK:-0}
      ALERT_NEW_BLOCK_MONERO: ${ALERT_NEW_BLOCK_MONERO:-0}
      ALERT_NEW_BLOCK_TARI: ${ALERT_NEW_BLOCK_TARI:-0}
      ALERT_NEW_BLOCK_LITECOIN: ${ALERT_NEW_BLOCK_LITECOIN:-0}
      ALERT_NEW_BLOCK_DOGECOIN: ${ALERT_NEW_BLOCK_DOGECOIN:-0}
      ALERT_NEW_BLOCK_BITCOINCASH: ${ALERT_NEW_BLOCK_BITCOINCASH:-0}
      ALERT_NEW_BLOCK_ZCASH: ${ALERT_NEW_BLOCK_ZCASH:-0}
      NODE_NAME: ${NODE_NAME:-bitcoin-node}
      STACK_VERSION: ${STACK_VERSION:-dev}
      WATCH_WALLETS_B64: ${WATCH_WALLETS_B64:-}
    volumes:
      - ${BITCOIN_DATA_DIR:-./data/bitcoin}:/data:ro
      - ${MONERO_DATA_DIR:-./data/monero}:/data-monero:ro
      - ${TARI_DATA_DIR:-./data/tari}:/data-tari:ro
      - ${LITECOIN_DATA_DIR:-./data/litecoin}:/data-litecoin:ro
      - ${DOGECOIN_DATA_DIR:-./data/dogecoin}:/data-dogecoin:ro
      - ${BITCOINCASH_DATA_DIR:-./data/bitcoincash}:/data-bitcoincash:ro
      - ${ZCASH_DATA_DIR:-./data/zcash}:/data-zcash:ro
      # writable state (the saved watch-only wallet list); the chain stays read-only
      - dashboard_state:/state
    restart: ${STACK_RESTART_POLICY:-on-failure:5}
    logging: *logging
    healthcheck:
      # Any HTTP response means alive — 401 is expected when auth is enabled
      test: ["CMD", "/app/dashboard", "healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 1m
    networks:
      btc_net:
        ipv4_address: 172.29.0.27
    dns:
      - 127.0.0.1

networks:
  btc_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
  tor_egress:
    driver: bridge

volumes:
  tor_data:
  dashboard_state:
  monero_wallets:
  tari_wallet:
  tari_wallet_data:
