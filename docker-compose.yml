# Keep unbounded container logs from eating the disk; bitcoind also writes
# its own debug.log in the datadir (rotated by bitcoind itself).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  tor:
    # Prebuilt release image; downloads use the host's Docker settings.
    image: ghcr.io/vijitsingh97/bitcoin-starter-stack-tor:${STACK_VERSION:-latest}
    build: ${STACK_ROOT:-.}/build/tor
    container_name: tor
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    environment:
      DASHBOARD_ONION: ${DASHBOARD_ONION:-0}
      BITCOIN_RPC_EXPOSE: ${BITCOIN_RPC_EXPOSE:-0}
      MONERO_RPC_EXPOSE: ${MONERO_RPC_EXPOSE:-0}
      MONERO_ZMQ_EXPOSE: ${MONERO_ZMQ_EXPOSE:-0}
    volumes:
      - tor_data:/var/lib/tor
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9050 && nc -z 127.0.0.1 8000"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5m
    networks:
      btc_net:
        ipv4_address: 172.29.0.25
        gw_priority: 0
      tor_egress:
        gw_priority: 1
    ports:
      - "${DASHBOARD_BIND_IP:-127.0.0.1}:80:8000"

  bitcoin:
    image: bitcoin/bitcoin:32.1@sha256:d2454aaf2ff4ce1ebbc49f4aa05ed044c907b849a80a3f4c0ad23e488e50bbe0
    container_name: bitcoin
    profiles: ["bitcoin"]
    labels:
      - "io.node-starter-stack.resource-profile=${BITCOIN_RESOURCE_PROFILE:-off}"
      - "io.node-starter-stack.steady-cpus=${BITCOIN_STEADY_CPUS:-1}"
      - "io.node-starter-stack.steady-memory-mb=${BITCOIN_STEADY_MEM_LIMIT_MB:-2048}"
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # optional memory cap (0 = unlimited; see bitcoin.mem_limit_mb in config).
    # Bounds a bitcoind memory blowup to a container restart, not a host OOM.
    mem_limit: ${BITCOIN_MEM_LIMIT:-0}
    # tor's group (gid 101 in the tor image) — lets bitcoind read the
    # control-auth cookie for the optional inbound onion service
    group_add:
      - "101"
    environment:
      RPC_USER: ${BITCOIN_RPC_USER:?run ./configure.sh first}
      RPCAUTH_SALT: ${BITCOIN_RPCAUTH_SALT:?run ./configure.sh first}
      RPCAUTH_HASH: ${BITCOIN_RPCAUTH_HASH:?run ./configure.sh first}
      DBCACHE: ${BITCOIN_DBCACHE:-3000}
      PRUNE: ${BITCOIN_PRUNE:-0}
      INBOUND_ONION: ${BITCOIN_INBOUND_ONION:-0}
      BLOCKFILTERINDEX: ${BITCOIN_BLOCKFILTERINDEX:-0}
    volumes:
      - ${BITCOIN_DATA_DIR:-./data/bitcoin}:/data
      - ${STACK_ROOT:-.}/build/bitcoin/bitcoin.conf:/data/bitcoin.conf:ro
      - tor_data:/var/lib/tor:ro
    # Clear stale lock files from an unclean shutdown, then start bitcoind.
    # Auth uses rpcauth (salted hash) — the plaintext RPC password never
    # enters this container. Settings come from the environment (configure.sh).
    # -onion must be EXPLICIT: with -torcontrol (inbound onion), bitcoind asks
    # tor for its SOCKS listener, gets 0.0.0.0:9050, rewrites it to
    # 127.0.0.1:9050 (dead in this container), and silently overrides a
    # non-explicit onion proxy — killing all outbound onion connections.
    # The exec line must stay a single line: a YAML line break here becomes a
    # shell line break, silently dropping every flag after it (see tests/test_e2e.sh).
    entrypoint:
      - /bin/sh
      - -c
      - |
        find /data -name '*.lock' -delete
        find /data -name 'LOCK' -delete
        RPCAUTH=$$(printf '%s:%s$$%s' "$$RPC_USER" "$$RPCAUTH_SALT" "$$RPCAUTH_HASH")
        ONION_ARGS=""
        if [ "$$INBOUND_ONION" = "1" ]; then ONION_ARGS="-listen=1 -listenonion=1 -torcontrol=172.29.0.25:9051"; fi
        NET_ARGS="-proxy=172.29.0.25:9050 -onion=172.29.0.25:9050 -onlynet=onion"
        exec bitcoind -datadir=/data -conf=/data/bitcoin.conf -rpcauth="$$RPCAUTH" -dbcache="$$DBCACHE" -prune="$$PRUNE" -blockfilterindex="$$BLOCKFILTERINDEX" -maxconnections=125 -inboundrelaypercent=100 $$NET_ARGS $$ONION_ARGS
    stop_signal: SIGTERM
    stop_grace_period: 5m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      # Cookie auth: bitcoin-cli reads /data/.cookie, no credentials needed here
      test: ["CMD-SHELL", "bitcoin-cli -datadir=/data getblockchaininfo >/dev/null"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30m
    networks:
      btc_net:
        ipv4_address: 172.29.0.26
    dns:
      - 127.0.0.1

  monero:
    image: ghcr.io/vijitsingh97/bitcoin-starter-stack-monero:${STACK_VERSION:-latest}
    build:
      context: ${STACK_ROOT:-.}/build/monero
    container_name: monero
    profiles: ["monero"]
    labels:
      - "io.node-starter-stack.resource-profile=${MONERO_RESOURCE_PROFILE:-off}"
      - "io.node-starter-stack.steady-cpus=${MONERO_STEADY_CPUS:-1}"
      - "io.node-starter-stack.steady-memory-mb=${MONERO_STEADY_MEM_LIMIT_MB:-2048}"
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 0
    cpus: 0
    environment:
      MONERO_RPC_USER: ${MONERO_RPC_USER:?run ./configure.sh first}
      MONERO_RPC_PASSWORD: ${MONERO_RPC_PASSWORD:?run ./configure.sh first}
      TOR_PROXY: 172.29.0.25:9050
    volumes:
      - ${MONERO_DATA_DIR:-./data/monero}:/data
    stop_signal: SIGTERM
    stop_grace_period: 5m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "/usr/local/bin/monero-healthcheck"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30m
    networks:
      btc_net:
        ipv4_address: 172.29.0.30
    dns:
      - 127.0.0.1

  monero-wallet:
    image: ghcr.io/vijitsingh97/bitcoin-starter-stack-monero:${STACK_VERSION:-latest}
    build:
      context: ${STACK_ROOT:-.}/build/monero
    container_name: monero-wallet
    profiles: ["monero"]
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 512m
    cpus: 0.5
    environment:
      MONERO_RPC_USER: ${MONERO_RPC_USER:?run ./configure.sh first}
      MONERO_RPC_PASSWORD: ${MONERO_RPC_PASSWORD:?run ./configure.sh first}
      MONERO_WALLET_RPC_USER: ${MONERO_WALLET_RPC_USER:?run ./configure.sh first}
      MONERO_WALLET_RPC_PASSWORD: ${MONERO_WALLET_RPC_PASSWORD:?run ./configure.sh first}
    volumes:
      - monero_wallets:/wallets
    tmpfs:
      - /run/monero-wallet:mode=0700,uid=1000,gid=1000
      - /tmp:mode=0700,uid=1000,gid=1000
    entrypoint: ["/usr/local/bin/monero-wallet-entrypoint"]
    depends_on:
      monero:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "/usr/local/bin/monero-wallet-healthcheck"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 5m
    networks:
      btc_net:
        ipv4_address: 172.29.0.31
    dns:
      - 127.0.0.1

  dashboard:
    # Prebuilt release image, with an explicit build target for development.
    image: ghcr.io/vijitsingh97/bitcoin-starter-stack-dashboard:${STACK_VERSION:-latest}
    build:
      context: ${STACK_ROOT:-.}
      dockerfile: build/dashboard/Dockerfile
    container_name: dashboard
    # runs non-root (uid 1000) via USER in build/dashboard/Dockerfile — the
    # exposed service needs no root; it binds an unprivileged port and only
    # writes the /state volume (pre-owned by 1000 in the image)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      BITCOIN_ENABLED: ${BITCOIN_ENABLED:-1}
      RPC_USER: ${BITCOIN_RPC_USER:?run ./configure.sh first}
      RPC_PASSWORD: ${BITCOIN_RPC_PASSWORD:?run ./configure.sh first}
      BITCOIN_RPC_EXPOSE: ${BITCOIN_RPC_EXPOSE:-0}
      BITCOIN_RPC_BIND_IP: ${BITCOIN_RPC_BIND_IP:-127.0.0.1}
      BITCOIN_RPC_PORT: ${BITCOIN_RPC_PORT:-8332}
      MONERO_ENABLED: ${MONERO_ENABLED:-0}
      MONERO_RPC_URL: ${MONERO_RPC_URL:-http://172.29.0.30:18085}
      MONERO_RPC_USER: ${MONERO_RPC_USER:-}
      MONERO_RPC_PASSWORD: ${MONERO_RPC_PASSWORD:-}
      MONERO_WALLET_RPC_URL: ${MONERO_WALLET_RPC_URL:-http://172.29.0.31:18082}
      MONERO_WALLET_RPC_USER: ${MONERO_WALLET_RPC_USER:-}
      MONERO_WALLET_RPC_PASSWORD: ${MONERO_WALLET_RPC_PASSWORD:-}
      MONERO_WALLET_PASSWORD: ${MONERO_WALLET_PASSWORD:-}
      MONERO_DATA_DIR: /data-monero
      MONERO_RPC_EXPOSE: ${MONERO_RPC_EXPOSE:-0}
      MONERO_RPC_BIND_IP: ${MONERO_RPC_BIND_IP:-127.0.0.1}
      MONERO_RPC_PORT: ${MONERO_RPC_PORT:-18081}
      MONERO_ZMQ_EXPOSE: ${MONERO_ZMQ_EXPOSE:-0}
      MONERO_ZMQ_BIND_IP: ${MONERO_ZMQ_BIND_IP:-127.0.0.1}
      MONERO_ZMQ_PORT: ${MONERO_ZMQ_PORT:-18083}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      DASHBOARD_BIND_IP: ${DASHBOARD_BIND_IP:-127.0.0.1}
      DASHBOARD_CONTROL: ${DASHBOARD_CONTROL:-0}
      SETTINGS_PORT: "8001"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      HEALTHCHECKS_URL: ${HEALTHCHECKS_URL:-}
      ALERT_NEW_BLOCK: ${ALERT_NEW_BLOCK:-0}
      ALERT_NEW_BLOCK_MONERO: ${ALERT_NEW_BLOCK_MONERO:-0}
      NODE_NAME: ${NODE_NAME:-bitcoin-node}
      STACK_VERSION: ${STACK_VERSION:-dev}
      WATCH_WALLETS_B64: ${WATCH_WALLETS_B64:-}
    volumes:
      - ${BITCOIN_DATA_DIR:-./data/bitcoin}:/data:ro
      - ${MONERO_DATA_DIR:-./data/monero}:/data-monero:ro
      # writable state (the saved watch-only wallet list); the chain stays read-only
      - dashboard_state:/state
    restart: unless-stopped
    logging: *logging
    healthcheck:
      # Any HTTP response means alive — 401 is expected when auth is enabled
      test: ["CMD", "/app/dashboard", "healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 1m
    networks:
      btc_net:
        ipv4_address: 172.29.0.27
    dns:
      - 127.0.0.1

networks:
  btc_net:
    driver: bridge
    name: btc_net
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
  tor_egress:
    driver: bridge
    name: tor_egress

volumes:
  tor_data:
  dashboard_state:
  monero_wallets:
