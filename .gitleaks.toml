# gitleaks config. Extends the default rules; allowlists the placeholder and
# test-only credentials in this repo so the secret scan is signal, not noise.
[extend]
useDefault = true

[allowlist]
description = "Placeholders and test fixtures — no real secrets"
paths = [
  '''config\.example\.json''',      # documented placeholders
  '''build/dashboard/tests/.*''',   # unit-test fixtures
  '''tests/.*''',                   # shell test fixtures
]
regexes = [
  # Public General Fund view key: https://www.getmonero.org/get-started/contributing/
  '''f359631075708155cc3d92a32b75a7d02a5dcf27756707b47a2b31b21c389501''',
  '''create_a_(username|password)_for_node''',
  '''^(?:bench:)?benchpass$''',
  '''1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa''',
  '''34xp4vRoCGJym3xR7yCVPFHoCNxv4Twseo''',
  '''bc1qcr8te4kr609gcawutmrza0j4xv80jy8z306fyu''',
  '''zpub6rFR7y4Q2AijBEqTUquhVz398htDFrtymD9xYYfG1m4wAcvPhXNfE3EfH1r1ADqtfSdVCToUG868RvUUkgDKf31mGDtKsAYz2oz2AGutZYs''',
